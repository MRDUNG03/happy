<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Vợ Yêu ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; overflow-x:hidden;
 font-family:'Segoe UI',sans-serif;
 background:linear-gradient(135deg,#ff9aaf,#ffc3d2,#ffe1ec);
 background-attachment:fixed;
 color:#8b234d;text-align:center;
}
#start{
 min-height:100vh;display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:20px;
}
h1{font-size:clamp(27px,6vw,42px);color:#fff;
 text-shadow:2px 3px 8px #d94c83}
.subtitle{color:white;font-size:18px}
.cake{position:relative;margin:65px auto 35px;width:220px;height:140px}
.layer{
 position:absolute;bottom:0;width:220px;height:90px;
 background:linear-gradient(#ff78a5,#ed3979);
 border-radius:12px 12px 20px 20px;
 box-shadow:0 9px 0 #c92d65;
}
.layer:before{
 content:"";position:absolute;top:0;width:100%;height:25px;
 background:#fff0f5;border-radius:50%;
}
.icing{
 position:absolute;top:18px;left:0;width:100%;height:30px;
 border-radius:50%;background:#fff1f6;
}
.candle{
 position:absolute;bottom:85px;width:7px;height:48px;
 background:repeating-linear-gradient(45deg,#fff 0 5px,#ff5b98 5px 10px);
 border-radius:3px;z-index:2;
}
.flame{
 position:absolute;top:-19px;left:-3px;width:13px;height:19px;
 background:radial-gradient(#fff5a0,#ff9c20,#ff5c27);
 border-radius:50% 50% 45% 45%;
 box-shadow:0 0 15px #ffb52e;
 animation:flicker .35s infinite alternate;
}
@keyframes flicker{to{transform:scale(.8,1.15) rotate(5deg)}}
.candle.off .flame{display:none}
button{
 border:0;padding:15px 28px;border-radius:40px;
 background:#e93679;color:white;font-size:18px;
 font-weight:bold;cursor:pointer;
 box-shadow:0 5px 15px #b52c60;
}
button:active{transform:scale(.95)}
#letter{
 display:none;max-width:720px;margin:30px auto;
 padding:30px 23px;background:#fff9fc;
 border-radius:22px;box-shadow:0 10px 35px #b93e7060;
 text-align:left;animation:enter 1.5s ease;
}
@keyframes enter{
 from{opacity:0;transform:translateX(100vw) rotate(5deg)}
 to{opacity:1;transform:translateX(0) rotate(0)}
}
#letter h2{text-align:center;color:#e52e78;font-size:26px}
.paragraph{
 opacity:0;transform:translateY(18px);
 transition:all 1s ease;
 font-size:16px;line-height:1.9;margin:20px 0;
}
.paragraph.show{opacity:1;transform:translateY(0)}

/* Ảnh kỷ niệm */
.photo{
 opacity:0;transform:translateY(30px) scale(.9) rotate(var(--tilt,0deg));
 transition:all 1.3s cubic-bezier(.2,.8,.2,1);
 margin:28px auto;width:min(100%,420px);
 background:#fff;padding:10px 10px 14px;border-radius:12px;
 box-shadow:0 10px 28px #b93e7066;
}
.photo.show{opacity:1;transform:translateY(0) scale(1) rotate(var(--tilt,0deg))}
.photo img{display:block;width:100%;height:auto;border-radius:6px}
.photo .cap{
 margin-top:10px;text-align:center;color:#e52e78;
 font-weight:600;font-size:15px;
}

.heart{
 position:fixed;bottom:-30px;pointer-events:none;
 animation:fly 5s linear forwards;
}
@keyframes fly{
 to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:5}
.hidden{display:none!important}
.signature{text-align:center;color:#e52e78;font-size:22px;font-weight:bold;
 opacity:0;transition:opacity 1.5s ease}
.signature.show{opacity:1}
</style>
</head>

<div id="start">

  <div class="layer"><div class="icing"></div></div>
 </div>

 <h2 style="color:white">❤️</h2>

<canvas id="fireworks"></canvas>

<div id="letter">

let done=false, userScrolled=false;
['wheel','touchmove'].forEach(e=>addEventListener(e,()=>userScrolled=true,{passive:true}));

function blow(){
 if(done)return;
 done=true;
 document.querySelectorAll('.candle').forEach((c,i)=>{
  setTimeout(()=>c.classList.add('off'),i*70);
 });
 document.querySelector('button').textContent='❤️ Chàng yêu nàng ❤️';
 setTimeout(()=>{
  document.getElementById('start').classList.add('hidden');
  document.getElementById('letter').style.display='block';
  showMessages();
  fireworks();
  setInterval(heart,350);
 },2400);
}

function showMessages(){
 const box=document.getElementById('content');
 let t=700;
 const reveal=(el,delay)=>setTimeout(()=>{
  el.classList.add('show');
  if(!userScrolled) el.scrollIntoView({behavior:'smooth',block:'center'});
 },delay);

 messages.forEach((msg,i)=>{
  const p=document.createElement('p');
  p.className='paragraph';
  p.textContent=msg;
  box.appendChild(p);
  reveal(p,t);
  t+=1600;

  photos.filter(ph=>ph.after===i).forEach(ph=>{
   const fig=document.createElement('div');
   fig.className='photo';
   fig.style.setProperty('--tilt',ph.tilt+'deg');
   const img=document.createElement('img');
   img.src=ph.src;img.alt=ph.cap;
   const cap=document.createElement('div');
   cap.className='cap';cap.textContent=ph.cap;
   fig.appendChild(img);fig.appendChild(cap);
   box.appendChild(fig);
   reveal(fig,t);
   t+=2400;
  });
 });
 reveal(document.getElementById('sig'),t);
}

function heart(){
 const h=document.createElement('div');
 h.className='heart';
 h.textContent=['❤️','💕','💗','💖','🥰'][Math.floor(Math.random()*5)];
 h.style.left=Math.random()*100+'vw';
 h.style.fontSize=(18+Math.random()*25)+'px';
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),5000);
}

// Pháo hoa
function fireworks(){
 const canvas=document.getElementById('fireworks');
 const ctx=canvas.getContext('2d');
 canvas.width=innerWidth;canvas.height=innerHeight;
 let particles=[];
 for(let i=0;i<180;i++){
  particles.push({
   x:Math.random()*canvas.width,
   y:Math.random()*canvas.height,
   vx:(Math.random()-.5)*5,
   vy:(Math.random()-.5)*5,
   life:70+Math.random()*40,
   color:['#ff3b86','#ffdc55','#ffffff','#a64dff'][i%4]
  });
 }
 function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
   ctx.fillStyle=p.color;
   ctx.globalAlpha=Math.max(0,p.life/100);
   ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
   p.x+=p.vx;p.y+=p.vy;p.life--;
  });
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
  if(particles.length)requestAnimationFrame(draw);
  else canvas.remove();
 }
 draw();
}
</script>

@keyframes flicker{to{transform:scale(.8,1.15) rotate(5deg)}}
.candle.off .flame{display:none}
button{
 border:0;padding:15px 28px;border-radius:40px;
 background:#e93679;color:white;font-size:18px;
 font-weight:bold;cursor:pointer;
 box-shadow:0 5px 15px #b52c60;
}
button:active{transform:scale(.95)}
#letter{
 display:none;max-width:720px;margin:30px auto;
 padding:30px 23px;background:#fff9fc;
 border-radius:22px;box-shadow:0 10px 35px #b93e7060;
 text-align:left;animation:enter 1.5s ease;
}
@keyframes enter{
 from{opacity:0;transform:translateX(100vw) rotate(5deg)}
 to{opacity:1;transform:translateX(0) rotate(0)}
}
#letter h2{text-align:center;color:#e52e78;font-size:26px}
.paragraph{
 opacity:0;transform:translateY(18px);
 transition:all 1s ease;
 font-size:16px;line-height:1.9;margin:20px 0;
}
.paragraph.show{opacity:1;transform:translateY(0)}

/* Ảnh kỷ niệm */
.photo{
 opacity:0;transform:translateY(30px) scale(.9) rotate(var(--tilt,0deg));
 transition:all 1.3s cubic-bezier(.2,.8,.2,1);
 margin:28px auto;width:min(100%,420px);
 background:#fff;padding:10px 10px 14px;border-radius:12px;
 box-shadow:0 10px 28px #b93e7066;
}
.photo.show{opacity:1;transform:translateY(0) scale(1) rotate(var(--tilt,0deg))}
.photo img{display:block;width:100%;height:auto;border-radius:6px}
.photo .cap{
 margin-top:10px;text-align:center;color:#e52e78;
 font-weight:600;font-size:15px;
}

.heart{
 position:fixed;bottom:-30px;pointer-events:none;
 animation:fly 5s linear forwards;
}
@keyframes fly{
 to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:5}
.hidden{display:none!important}
#musicBtn{
 position:fixed;top:14px;right:14px;z-index:10;display:none;
 width:46px;height:46px;padding:0;font-size:22px;line-height:46px;
 background:#fff;color:#e93679;box-shadow:0 4px 12px #b93e7080;
}
.signature{text-align:center;color:#e52e78;font-size:22px;font-weight:bold;
 opacity:0;transition:opacity 1.5s ease}
.signature.show{opacity:1}
</style>
</head>

  <div class="layer"><div class="icing"></div></div>
 </div>

<canvas id="fireworks"></canvas>

 c.style.bottom=(85+Math.floor(i/11)*22)+'px';
 const f=document.createElement('div');
 f.className='flame';
 c.appendChild(f);
 cake.appendChild(c);
}

// ===== Nhạc Happy Birthday (tạo bằng Web Audio, không cần file mp3) =====
const NOTE={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
const TUNE=[
 ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
 ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
 ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',1],
 ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]
];
const BEAT=.56;
let actx=null,master=null,muted=false,musicTimer=null;

function playNote(freq,start,dur){
 const g=actx.createGain();
 g.connect(master);
 g.gain.setValueAtTime(0,start);
 g.gain.linearRampToValueAtTime(.5,start+.02);
 g.gain.exponentialRampToValueAtTime(.001,start+dur*.95);
 [[freq,'sine',1],[freq*2,'triangle',.25]].forEach(([f,type,vol])=>{
  const o=actx.createOscillator();
  const og=actx.createGain();
  o.type=type;o.frequency.value=f;og.gain.value=vol;
  o.connect(og);og.connect(g);
  o.start(start);o.stop(start+dur);
 });
}

function playTune(){
 let t=actx.currentTime+.1;
 TUNE.forEach(([n,b])=>{
  playNote(NOTE[n],t,b*BEAT*1.15);
  t+=b*BEAT;
 });
 // lặp lại sau khi hát xong
 musicTimer=setTimeout(playTune,(t-actx.currentTime+2.5)*1000);
}

function startMusic(){
 try{
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain();
  master.gain.value=.35;
  master.connect(actx.destination);
  playTune();
  document.getElementById('musicBtn').style.display='block';
 }catch(e){}
}

function toggleMusic(){
 if(!actx)return;
 muted=!muted;
 master.gain.value=muted?0:.35;
 document.getElementById('musicBtn').textContent=muted?'🔇':'🔊';
}

let done=false, userScrolled=false;
['wheel','touchmove'].forEach(e=>addEventListener(e,()=>userScrolled=true,{passive:true}));

function blow(){
 if(done)return;
 done=true;
 startMusic();
 document.querySelectorAll('.candle').forEach((c,i)=>{
  setTimeout(()=>c.classList.add('off'),i*70);
 });
 document.querySelector('button').textContent='❤️ Chàng yêu nàng ❤️';
 setTimeout(()=>{
  document.getElementById('start').classList.add('hidden');
  document.getElementById('letter').style.display='block';
  showMessages();
  fireworks();
  setInterval(heart,350);
 },2400);
}

function showMessages(){
 const box=document.getElementById('content');
 let t=700;
 const reveal=(el,delay)=>setTimeout(()=>{
  el.classList.add('show');
  if(!userScrolled) el.scrollIntoView({behavior:'smooth',block:'center'});
 },delay);

 messages.forEach((msg,i)=>{
  const p=document.createElement('p');
  p.className='paragraph';
  p.textContent=msg;
  box.appendChild(p);
  reveal(p,t);
  t+=1600;

  photos.filter(ph=>ph.after===i).forEach(ph=>{
   const fig=document.createElement('div');
   fig.className='photo';
   fig.style.setProperty('--tilt',ph.tilt+'deg');
   const img=document.createElement('img');
   img.src=ph.src;img.alt=ph.cap;
   const cap=document.createElement('div');
   cap.className='cap';cap.textContent=ph.cap;
   fig.appendChild(img);fig.appendChild(cap);
   box.appendChild(fig);
   reveal(fig,t);
   t+=2400;
  });
 });
 reveal(document.getElementById('sig'),t);
}

function heart(){
 const h=document.createElement('div');
 h.className='heart';
 h.textContent=['❤️','💕','💗','💖','🥰'][Math.floor(Math.random()*5)];
 h.style.left=Math.random()*100+'vw';
 h.style.fontSize=(18+Math.random()*25)+'px';
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),5000);
}

// Pháo hoa
function fireworks(){
 const canvas=document.getElementById('fireworks');
 const ctx=canvas.getContext('2d');
 canvas.width=innerWidth;canvas.height=innerHeight;
 let particles=[];
 for(let i=0;i<180;i++){
  particles.push({
   x:Math.random()*canvas.width,
   y:Math.random()*canvas.height,
   vx:(Math.random()-.5)*5,
   vy:(Math.random()-.5)*5,
   life:70+Math.random()*40,
   color:['#ff3b86','#ffdc55','#ffffff','#a64dff'][i%4]
  });
 }
 function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
   ctx.fillStyle=p.color;
   ctx.globalAlpha=Math.max(0,p.life/100);
   ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
   p.x+=p.vx;p.y+=p.vy;p.life--;
  });
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
  if(particles.length)requestAnimationFrame(draw);
  else canvas.remove();
 }
 draw();
}
</script>
